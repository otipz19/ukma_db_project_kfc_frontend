<mat-form-field appearance="fill" floatLabel="auto">
  <mat-label>{{ $label() }}</mat-label>

  <input matInput [formControl]="$control()" [matDatepicker]="datepicker"/>

  <mat-datepicker-toggle matIconSuffix [for]="datepicker"/>

  <mat-datepicker #datepicker [startAt]="''"/>

  @if ($control().invalid) {
    <mat-error>{{ $control().errors | errorMessage }}</mat-error>
  }
</mat-form-field>
