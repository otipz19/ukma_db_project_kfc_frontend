<mat-form-field appearance="fill" floatLabel="auto">
  <mat-label>{{ $label() }}</mat-label>

  <input [type]="$showPassword() ? 'text' : 'password'" matInput
         [formControl]="$control()" #field/>

  <button
    mat-icon-button
    matSuffix
    (click)="onShowPassword($event)"
    tabindex="-1"
  >
    <mat-icon>{{ $showPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
  </button>

  @if ($maxLength()) {
    <mat-hint align="end">
      {{ field.value.length }} / {{ $maxLength() }}
    </mat-hint>
  }

  @if ($control().invalid) {
    <mat-error>{{ $control().errors | errorMessage }}</mat-error>
  }
</mat-form-field>
