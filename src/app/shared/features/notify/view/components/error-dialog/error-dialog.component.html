<div (click)="onClose()">
  <h2 mat-dialog-title>{{ config?.title ?? 'Зрада' }}</h2>

  <mat-dialog-content>
    {{ $errorMessage() }}
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button color="warn">{{ config?.btnLabel ?? 'Невдача спіткала' }}</button>
  </mat-dialog-actions>
</div>
