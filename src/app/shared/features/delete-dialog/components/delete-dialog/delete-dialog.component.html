<h2 mat-dialog-title>Підтвердження видалення</h2>

<mat-dialog-content>
  @if (data.customMessage) {
    {{data.customMessage}}
  } @else {
    Ви впевнені, що хочете видалити {{data.entityTypeName}} <strong>{{ data.entityInstanceName }}</strong>?
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button color="primary" (click)="onCancel()">Скасувати</button>
  <button mat-button color="warn" (click)="onConfirm()">Видалити</button>
</mat-dialog-actions>
