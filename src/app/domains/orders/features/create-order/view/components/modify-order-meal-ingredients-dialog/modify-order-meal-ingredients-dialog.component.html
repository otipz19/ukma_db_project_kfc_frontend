<h2 mat-dialog-title>Модифікація інгредієнтів страви</h2>

<mat-dialog-content>
  <div class="dialog-content-wrapper">
    <div class="cards-list">
      @for (ingredient of ingredients; track ingredient.id) {
        <app-order-meal-ingredient-card [ingredient]="ingredient"/>
      }
    </div>

    <div class="buttons-container">
      <button mat-raised-button color="primary" (click)="onCancel()">
        Скасувати
      </button>

      <button mat-raised-button color="accent" (click)="onSubmit()">
        Зберігти
      </button>
    </div>
  </div>
</mat-dialog-content>
