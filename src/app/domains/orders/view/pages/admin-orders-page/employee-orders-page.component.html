<div class="header-container">
  <div class="title-wrapper">
    <div>
      <h2>Замовлення</h2>
    </div>

    <div class="right-end-toolbar">
      <button mat-raised-button color="primary" (click)="onExportReport()">
        <mat-icon>print</mat-icon>
        <span>Експортувати звіт</span>
      </button>

      @if (authService.hasRole(UserRole.ADMIN)) {
        <button mat-raised-button color="warn" (click)="onDeleteOldOrders()">
          <mat-icon>delete</mat-icon>
          <span>Видалити застарілі замовлення</span>
        </button>
      }
    </div>
  </div>

  <app-orders-chip-filters [store]="store"/>
</div>

<div class="list-container">
  <app-orders-list [orders]="$orders()"
                   [displayedColumns]="displayedColumns"
                   (sort)="onSort($event)"
                   [paginator]="store.paginatorModel"
                   (page)="onPagination($event)"/>
</div>
