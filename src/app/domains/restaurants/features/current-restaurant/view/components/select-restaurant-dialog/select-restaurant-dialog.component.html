<h2 mat-dialog-title>Ресторани</h2>

<mat-dialog-content>
  <div class="content-wrapper">
    <div class="search-bar-container">
      <app-search-bar class="search-bar" label="Пошук ресторана" (search)="onSearch($event)"/>
    </div>

    <div class="list-container">
      <app-restaurants-list [restaurants]="$restaurants()" [hideActions]="true" (select)="onSelect($event)"/>
    </div>
  </div>
</mat-dialog-content>
