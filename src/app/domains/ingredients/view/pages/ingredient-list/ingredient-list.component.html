<div class="topbar-container">
  <app-search-bar (search)="onSearch($event)" class="search-bar"/>
  <button mat-raised-button color="accent" (click)="onCreateClick()">
    Створити новий
  </button>
</div>

<div class="ingredient-grid">
  @for (ingredient of $ingredients(); track ingredient.title) {
    <div class="ingredient-item">
      <app-ingredient-card [ingredient]="ingredient"></app-ingredient-card>
    </div>
  }
</div>
