<mat-card>
  <mat-card-content>
    <form [formGroup]="form">
      <app-common-form-input-field class="default-form-input-field"
                                   [control]="form.controls.passportNumber"
                                   label="Номер паспорта"
                                   inputType="text"
                                   [maxLength]="14"
                                   iconSuffix="article"/>

      <app-common-form-input-field class="default-form-input-field"
                                   [control]="form.controls.surname"
                                   label="Прізвище"
                                   inputType="text"
                                   [maxLength]="64"
                                   iconSuffix="person"/>

      <app-common-form-input-field class="default-form-input-field"
                                   [control]="form.controls.firstName"
                                   label="Ім'я"
                                   inputType="text"
                                   [maxLength]="64"
                                   iconSuffix="person"/>

      <app-common-form-input-field class="default-form-input-field"
                                   [control]="form.controls.middleName!"
                                   label="По-батькові"
                                   inputType="text"
                                   [maxLength]="64"
                                   iconSuffix="person"/>

      <app-common-form-datepicker-field class="default-form-input-field"
                                        [control]="form.controls.birthDate"
                                        label="Дата народження"/>

      <app-common-form-input-field class="default-form-input-field"
                                   [control]="form.controls.salary"
                                   label="Заробітна плата"
                                   inputType="number"
                                   iconSuffix="paid"/>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button type="button" mat-raised-button color="primary" (click)="onCancel()">
      Скасувати
    </button>

    <button type="button" mat-raised-button color="accent" (click)="onSubmit()">
      Підтвердити
    </button>
  </mat-card-actions>
</mat-card>
