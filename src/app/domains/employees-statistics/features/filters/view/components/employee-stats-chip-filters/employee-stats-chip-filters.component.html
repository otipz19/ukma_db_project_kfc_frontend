<mat-chip-listbox multiple>
  <mat-chip-option [selected]="isPositionSelected(EmployeePosition.MANAGER)"
                   (click)="onPositionToggle(EmployeePosition.MANAGER)">
    Менеджери
  </mat-chip-option>
  <mat-chip-option [selected]="isPositionSelected(EmployeePosition.CASHIER)"
                   (click)="onPositionToggle(EmployeePosition.CASHIER)">
    Касири
  </mat-chip-option>
  <mat-chip-option [selected]="isPositionSelected(EmployeePosition.COOK)"
                   (click)="onPositionToggle(EmployeePosition.COOK)">
    Кухарі
  </mat-chip-option>
  <mat-chip-option (click)="onNumberToggle()">
    Кількість замовлень
    <mat-icon matChipRemove (click)="onNumberOpen()">menu</mat-icon>
  </mat-chip-option>
  <mat-chip-option (click)="onTotalPriceToggle()">
    Сумарна вартість замовлень
    <mat-icon matChipRemove (click)="onTotalPriceOpen()">menu</mat-icon>
  </mat-chip-option>
  <mat-chip-option (click)="onDateToggle()">
    Дата замовлень
    <mat-icon matChipRemove (click)="onDateOpen()">menu</mat-icon>
  </mat-chip-option>
</mat-chip-listbox>
