<app-common-data-card class="phones-card">
  <span title>Номери телефонів</span>
  <button relativeAction mat-icon-button color="primary" (click)="onEdit()">
    <mat-icon>edit</mat-icon>
  </button>
  @for (phone of $phones(); track phone; ) {
    <div class="contact-wrapper">
      <strong>{{ $index + 1 }}.</strong> <a mat-button color="primary" [href]="'tel:' + phone">+38{{ phone }}</a>
    </div>
  } @empty {
    <p>
      Немає жодного номеру телефону
    </p>
  }
</app-common-data-card>
