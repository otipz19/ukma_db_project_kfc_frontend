<mat-card class="data-card">
  <mat-card-header class="bordered-card-header card-header">
    <mat-card-title>
      Номери телефонів
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="card-content-wrapper">
      @for (phone of $phones(); track phone; ) {
        <div class="contact-wrapper">
          <strong>{{ $index + 1 }}.</strong> <a mat-button color="primary" [href]="'tel:' + phone">+38{{ phone }}</a>
        </div>
      } @empty {
        <p>
          Немає жодного номеру телефону
        </p>
      }
    </div>
  </mat-card-content>
</mat-card>
