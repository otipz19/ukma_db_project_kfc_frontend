<app-common-data-card class="emails-card">
  <span title>Пошта</span>
  <button relativeAction mat-icon-button color="primary" (click)="onEdit()">
    <mat-icon>edit</mat-icon>
  </button>
  @for (email of $emails(); track email; ) {
    <div class="contact-wrapper">
      <strong>{{ $index + 1 }}.</strong> <a mat-button color="primary" [href]="'mailto:' + email">{{ email }}</a>
    </div>
  } @empty {
    <p>
      Немає контактів електронної пошти
    </p>
  }
</app-common-data-card>
