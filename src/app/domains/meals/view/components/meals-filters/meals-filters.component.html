<mat-chip-listbox multiple>
  <mat-chip-option [selected]="isPriceEnabled()" (click)="onPriceRangeToggle()">
    Ціна
    <mat-icon matChipRemove (click)="onPriceRangeForm()">menu</mat-icon>
  </mat-chip-option>
  <mat-chip-option [selected]="isAdditionalPriceEnabled()" (click)="onAdditionalPriceToggle()">
    Додана вартість
    <mat-icon matChipRemove (click)="onAdditionalPriceForm()">menu</mat-icon>
  </mat-chip-option>
  <mat-chip-option [selected]="isWeightEnabled()" (click)="onWeightRangeToggle()">
    Вага
    <mat-icon matChipRemove (click)="onWeightRangeForm()">menu</mat-icon>
  </mat-chip-option>
  <mat-chip-option [selected]="isEnergeticValueEnabled()" (click)="onEnergeticValueToggle()">
    Енергетична цінність
    <mat-icon matChipRemove (click)="onEnergeticValueForm()">menu</mat-icon>
  </mat-chip-option>
</mat-chip-listbox>
