<mat-card class="item-list-card">
  <mat-card-header class="relative-card-header">
    <mat-card-title class="item-list-card-title">
      {{ $meal().title }}
    </mat-card-title>

    @if (!$hideActions()) {
      <div class="card-header-absolute-action">
        <button mat-icon-button color="primary" [routerLink]="[$meal().id]">
          <mat-icon>visibility</mat-icon>
        </button>
      </div>
    }
  </mat-card-header>

  <img imageLoader [imageType]="ImageType.MEAL_IMAGE"
       [title]="$meal().title"
       (imageLoaded)="onImageLoaded($event)"
       class="item-list-card-img"
       mat-card-image
       alt="{{ $meal().title }}"
  />

  <mat-card-content>
    <div class="item-list-card-info-container">
      <p>
        <strong>Ціна: </strong> {{ $meal().price }} грн
      </p>
      <p>
        <strong>Додана вартість: </strong> {{ $meal().additionalPrice }} грн
      </p>
      <p>
        <strong>Енергетична цінність:</strong> {{ $meal().energeticValue }} ккал
      </p>
      <p>
        <strong>Вага:</strong> {{ $meal().weight }} г
      </p>
    </div>
  </mat-card-content>

  <mat-card-actions class="item-list-card-actions-container">
    @if (!$hideActions() && $userRole() === UserRole.ADMIN) {
      <button mat-button color="primary" [routerLink]="[$meal().id, 'update']">
        <mat-icon>edit</mat-icon>
        <span>Редагувати</span>
      </button>
      <button mat-button color="warn" (click)="onDelete()">
        <mat-icon>delete</mat-icon>
        <span>Видалити</span>
      </button>
    }
  </mat-card-actions>
</mat-card>
